name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
          cache: false
      - name: Unit tests and static checks
        shell: bash
        working-directory: src
        run: |
          go version
          go vet ./...
          go test -count=1 ./...
          go build -trimpath -o ../keyai-commons .
      - name: Race detector
        if: runner.os == 'Linux'
        working-directory: src
        run: go test -race -count=1 ./...
      - name: Single-host process integration
        if: runner.os == 'Linux'
        run: python3 integration_test.py
      - name: Actual browser controls and mobile layout
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install 'playwright==1.57.0'
          python3 -m playwright install --with-deps chromium
          python3 browser_test.py
      - name: Public site layouts, localization and interactions
        if: runner.os == 'Linux'
        run: python3 scripts/site_acceptance.py
      - name: Check packaging and synchronized website
        if: runner.os == 'Linux'
        run: |
          python3 -m py_compile scripts/package_release.py scripts/sync_site.py integration_test.py browser_test.py
          cmp src/web/landing.html docs/index.html
          cmp src/web/landing.html site/index.html
  release:
    name: Portable packages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
          cache: false
      - name: Build portable clients and checksums
        run: python3 scripts/package_release.py
      - name: Publish explicitly experimental release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist-v02/*.zip dist-v02/SHA256SUMS.txt dist-v02/BUILD-MANIFEST.json --verify-tag --prerelease --title "KeyAI Commons $RELEASE_TAG | Network research preview" --notes-file RELEASE_NOTES.md
